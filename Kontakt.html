<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="Style/styles.css">
</head>

<body class="Kontakt">

  <!--Den övre blå banderollen-->
  <header>
    <div>
      <a href="Blomman.html">
        <img src="Bilder/blomma.banderoll.png" class="headerbild">
      </a>
    </div>

    <div>
      <a href="Rubrik-kontakt">
        <img src="Bilder/rubrik-kontakt.png" class="rubriker">
    </div>

    <div>
      <a href="index.html" class="tillbaka-knapp">
        Tillbaka!
      </a>
    </div>
  </header>

  <!--Rubriken-->
  <h1> 💙Ta kontakt med oss och ge oss dina bästa ställen!💙</h1>
  <h1>💙Vi älskar att få tips och du sitter säkert på riktigt bra sådanna!💙</h1>


  <!--Formuär för resetips-->
  <section class="resetips">
    <h2>Har du resetips?</h2>
    <p>Tipsa oss om en sevärdhet som vi inte får missa!</p>


    <form id="tipsform">
      <!--Första frågan-->
      <label for="sevärdhet">Vad heter sevärdheten?</label>
      <input type="text" id="sevardhet" required placeholder="Exempelvis Eiffeltornet">

      <!--Andra frågan-->
      <label for="plats">Var ligger den?</label>
      <input type="text" id="plats" required placeholder="Stad och Land">

      <!--Tredje frågan-->
      <label for="tips">Berätta mer om ditt tips!</label>
      <textarea id="tips" required placeholder="Varför borde vi besöka platsen?"></textarea>

      <!--Skicka in svar-->
      <button type="submit">Skicka tips!</button>
    </form>
  </section>


    <h1>💙</h1>
<!--Kopplar till javascript-->
<script src="Style/myscript.js"></script>

</body>

</html>
